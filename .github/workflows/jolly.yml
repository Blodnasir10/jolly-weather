name: Jolly - Klukkustundarlærdómur

on:
  schedule:
    # Keyrir 5 mínútum eftir hvern heilan tíma - 24x á dag
    - cron: '17 * * * *'
    # [v2] Fært úr '5 * * * *' í '17 * * * *' - GitHub mælir sjálft með að
    # forðast fyrstu mínúturnar eftir heilan tíma, þar sem tugþúsundir
    # verkflæða um allan heim reyna að keyra samtímis og áætlaðar keyrslur
    # geta dottið niður án viðvörunar. Þetta minnkar líkur á því, tryggir
    # það ekki (GitHub-hlið, ekki á okkar valdi).
  push:
    branches: [main]
  workflow_dispatch:

# Aðeins EIN keyrsla í einu. Ef ný keyrsla byrjar meðan önnur er í gangi
# bíður hún í stað þess að keyra samhliða - tvær samhliða keyrslur skrifa
# báðar í sömu skrár og önnur tapast.
concurrency:
  group: jolly-run
  cancel-in-progress: false

jobs:
  update-jolly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Sækja kóða
        uses: actions/checkout@v4
        with:
          # Sækja alla söguna svo rebase virki
          fetch-depth: 0

      - name: 🐍 Setja upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Setja upp pakka
        run: pip install requests

      - name: 🌦️ Keyra Jolly
        run: python jolly.py

      - name: 📋 Yfirlit
        if: always()
        run: |
          if [ -f docs/data/last_run.log ]; then
            {
              echo '## Jolly keyrsla'
              echo '```'
              tail -60 docs/data/last_run.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Vistun með ENDURTILRAUN. Ef einhver (t.d. þú í vafranum) hefur
      # breytt skrám meðan keyrslan stóð yfir, hafnar git venjulegu push
      # með "non-fast-forward" og ÖLL keyrslan tapast. Hér sækjum við
      # nýjustu útgáfu, setjum okkar gögn ofan á, og reynum aftur.
      - name: 💾 Vista gögn í GitHub
        run: |
          set -e
          git config user.name  "Jolly Bot"
          git config user.email "jolly@weather.bot"

          git add -A docs/data/*.json docs/data/*.log docs/data/verify/*.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Engar breytingar til að vista."
            exit 0
          fi

          git commit -m "🌦️ Jolly ${{ github.run_id }}"

          # Allt að 5 tilraunir: sækja nýjustu sögu, endurspila okkar
          # commit ofan á hana, ýta. Gagnaskrárnar eru okkar eigin
          # afurð svo við höldum OKKAR útgáfu ef árekstur verður.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Vistað (tilraun $i)."
              exit 0
            fi
            echo "Push hafnað - sæki nýjustu útgáfu og reyni aftur ($i/5)..."
            git fetch origin main
            git rebase -X ours origin/main || {
              echo "Rebase mistókst - nota merge í staðinn."
              git rebase --abort || true
              git merge -X ours origin/main -m "Sameina Jolly-gögn"
            }
            sleep $((i * 3))
          done

          echo "::error::Gat ekki vistað eftir 5 tilraunir."
          exit 1
