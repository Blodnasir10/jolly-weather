<!DOCTYPE html>
<html lang="is"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jolly · Egilsstaðir</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#f4f6fa;--sub:#9aa2b4;--faint:#646d82;
    --card:rgba(255,255,255,0.055);--card-top:rgba(255,255,255,0.11);
    --edge:rgba(255,255,255,0.10);--chill:#aac6ea;
    --sky-a:#0e1220;--sky-b:#141a2e;--sky-c:#1b2138;--glow:rgba(120,140,200,0.12);
  }
  html,body{height:100%}
  body{font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;
    color:var(--ink);background:#0a0d14;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;font-feature-settings:"tnum";
    padding-bottom:46px}
  .sky{position:fixed;inset:0;z-index:-2;transition:background 2s ease;
    background:radial-gradient(140% 90% at 50% -20%,var(--sky-c) 0%,transparent 55%),
      linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,var(--sky-c) 100%)}
  .glow{position:fixed;top:-15%;left:50%;transform:translateX(-50%);
    width:120%;height:45%;z-index:-1;pointer-events:none;transition:background 2s ease;
    background:radial-gradient(60% 100% at 50% 0%,var(--glow),transparent 70%)}
  .wrap{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px 0}

  .loc{text-align:center;margin-bottom:22px}
  .loc h1{font-size:33px;font-weight:300;letter-spacing:-.01em}
  .loc .region{font-size:14px;color:var(--sub);margin-top:3px;
    display:inline-flex;align-items:center;gap:5px}
  .loc .region svg{width:12px;height:12px;opacity:.7}

  .card{position:relative;
    background:linear-gradient(180deg,var(--card-top),var(--card) 40%);
    border-radius:26px;border:1px solid var(--edge);
    box-shadow:0 1px 0 rgba(255,255,255,0.10) inset,
      0 -20px 40px rgba(0,0,0,0.18) inset,0 12px 34px rgba(0,0,0,0.30);
    backdrop-filter:blur(24px) saturate(1.5);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);overflow:hidden}

  .hero{display:flex;align-items:center;gap:6px;padding:22px 24px;margin-bottom:12px}
  .hero .icon{width:120px;height:120px;flex-shrink:0;margin-left:-6px}
  .hero .right{margin-left:auto;text-align:right}
  .hero .temp{font-size:84px;font-weight:200;line-height:.92;letter-spacing:-.03em}
  .hero .temp::after{content:"°";font-weight:200;color:var(--chill);opacity:.7}
  .hero .desc{font-size:14px;color:var(--sub);margin-top:4px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px}
  .stat{padding:16px 12px}
  .stat .lbl{font-size:12px;color:var(--sub);margin-bottom:12px}
  .stat .mid{height:58px;display:flex;align-items:center;justify-content:center}
  .stat .val{font-size:18px;font-weight:400;margin-top:11px;text-align:center}
  .stat .val .u{font-size:12px;color:var(--sub);margin-left:2px}

  .compass{width:58px;height:58px}
  .cnow{font-size:18px;font-weight:400;text-align:center;margin-top:11px}
  .clater{font-size:11px;color:var(--faint);text-align:center;margin-top:2px}

  .sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:22px 6px 11px}

  .hourly{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;padding:16px 8px}
  .hourly::-webkit-scrollbar{display:none}
  .hrow{display:inline-flex;gap:2px}
  .hcell{flex:0 0 auto;width:58px;text-align:center;padding:5px 0}
  .hcell .h{font-size:12px;color:var(--sub);margin-bottom:10px}
  .hcell.now .h{color:var(--ink);font-weight:600}
  .hcell .ic{height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
  .hcell .t{font-size:16px;font-weight:400}
  .hcell .wa{display:flex;justify-content:center;margin-top:6px;height:12px}
  .hcell .p{font-size:10px;color:var(--chill);margin-top:4px;height:12px;opacity:.85}

  .days{padding:5px}
  .day{border-radius:19px;overflow:hidden;transition:background .2s}
  .day.open{background:rgba(255,255,255,0.03)}
  .day+.day{margin-top:2px}
  .dhead{display:grid;grid-template-columns:64px 1fr auto auto auto;
    align-items:center;gap:10px;padding:13px 13px;cursor:pointer}
  .dhead .dname{font-size:14px;font-weight:400}
  .dhead .dp{font-size:11px;color:var(--chill);opacity:.8;margin-top:2px;height:13px}
  .dhead .dicons{display:flex;gap:2px;justify-content:center}
  .dhead .dwind{display:flex;align-items:center;justify-content:center;opacity:.9}
  .dhead .dtemp{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dhead .dtemp .lo{color:var(--sub)}
  .dhead .chev{width:15px;color:var(--faint);transition:transform .25s;
    display:flex;align-items:center;justify-content:center}
  .day.open .chev{transform:rotate(180deg)}
  .ddetail{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .day.open .ddetail{max-height:200px}
  .ddin{padding:4px 15px 16px;display:grid;grid-template-columns:1fr 1fr;
    gap:13px 18px;border-top:1px solid rgba(255,255,255,0.06);margin-top:2px}
  .dstat{display:flex;flex-direction:column;gap:5px;padding-top:11px}
  .dstat .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .dstat .v{font-size:15px;font-weight:400;display:flex;align-items:center;gap:7px}

  .foot{text-align:center;font-size:11px;color:rgba(255,255,255,0.22);
    margin-top:26px;line-height:1.7}
  .foot span{color:var(--faint)}
</style></head>
<body>
  <div class="sky" id="sky"></div><div class="glow" id="glow"></div>
  <div class="wrap">
    <div class="loc">
      <h1>Egilsstaðir</h1>
      <div class="region">Austurland, Ísland
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
    </div>

    <div class="card hero">
      <div class="icon" id="heroIcon"></div>
      <div class="right">
        <div class="temp" id="heroTemp">–</div>
        <div class="desc" id="heroDesc">–</div>
      </div>
    </div>

    <div class="stats">
      <div class="card stat">
        <div class="lbl">Vindur</div>
        <div class="mid" id="windIcon"></div>
        <div class="val" id="windVal">–</div>
      </div>
      <div class="card stat">
        <div class="lbl">Vindátt</div>
        <div class="mid"><div class="compass" id="compass"></div></div>
        <div class="cnow" id="cNow">–</div>
        <div class="clater" id="cLater"></div>
      </div>
      <div class="card stat">
        <div class="lbl">Úrkoma</div>
        <div class="mid" id="precipIcon"></div>
        <div class="val" id="precipVal">–</div>
      </div>
    </div>

    <div class="sec">Klukkustundaspá</div>
    <div class="card hourly"><div class="hrow" id="hrow"></div></div>

    <div class="sec">Næstu dagar</div>
    <div class="card days" id="days"></div>

    <div class="foot" id="foot"></div>
  </div>
<script>
const FC_URL='https://raw.githubusercontent.com/Blodnasir10/jolly-weather/main/docs/data/jolly_forecast.json';

// ══ VINDÁTTAR-ÖR (vísar þangað sem vindur blæs: átt+180) ══
const WDEG={N:0,NNA:22.5,NA:45,ANA:67.5,A:90,ASA:112.5,SA:135,SSA:157.5,
  S:180,SSV:202.5,SV:225,VSV:247.5,V:270,VNV:292.5,NV:315,NNV:337.5};
function degToDir(d){const n=['N','NNA','NA','ANA','A','ASA','SA','SSA','S','SSV','SV','VSV','V','VNV','NV','NNV'];
  return n[Math.round(((d%360)/22.5))%16];}
function windArrow(deg,size){
  const s=size||11;const ang=(deg+180)%360;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24"
    style="transform:rotate(${ang}deg)" fill="none">
    <path d="M12 3 L12 21 M12 3 L7 9 M12 3 L17 9" stroke="#aac6ea"
      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/></svg>`;
}

// ══ VEÐURTÁKN ══
// kind ræðst af skýjahulu + úrkomu + hita. dropar/korn = fjöldi úr mm.
function precipCount(mm){ return mm<=0 ? 0 : Math.min(6, Math.ceil(mm)); }

function wxKind(cloud, precip, temp){
  if(precip>=0.1){
    if(temp<=-1) return 'snow';
    if(temp<3)   return 'sleet';
    return 'rain';
  }
  if(cloud==null) return 'cloudy';
  if(cloud<12) return 'clear';
  if(cloud<55) return 'partly';
  return 'cloudy';
}

// Raðar n dropum/kornum undir skýið á fallegan hátt (1-6)
function fallLayout(n){
  // x-hnit fyrir 1..6 stykki, miðjað undir skýi (viewBox 66 breitt)
  const rows={1:[[33]],2:[[26,40]],3:[[24,33,42]],
    4:[[26,40],[33,47]],5:[[24,33,42],[29,38]],6:[[24,33,42],[27,36,45]]};
  return rows[n]||rows[6];
}

let _iconSeq=0;
function wxIcon(size, kind, mm, isNight){
  const s=size, vb=66;
  const cid=`c${++_iconSeq}`;
  const defs=`<defs>
    <linearGradient id="${cid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/><stop offset="0.5" stop-color="#d4dcea"/>
      <stop offset="1" stop-color="#aeb9cd"/></linearGradient>
    <linearGradient id="${cid}d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8d1e0"/><stop offset="1" stop-color="#94a0b6"/></linearGradient>
    <radialGradient id="${cid}s" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#f4c869"/></radialGradient>
    <radialGradient id="${cid}m" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#eef2fb"/><stop offset="1" stop-color="#c2cde0"/></radialGradient>
    <radialGradient id="${cid}hl" cx="0.35" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="${cid}ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/></filter>
    <linearGradient id="${cid}rn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2d8f2"/><stop offset="1" stop-color="#8fb4e2"/></linearGradient>
  </defs>`;

  // Heiðskírt / léttskýjað - sól eða tungl
  if(kind==='clear'){
    if(isNight){
      return `<svg width="${s}" height="${s}" viewBox="0 0 ${vb} ${vb}">${defs}
        <circle cx="33" cy="30" r="15" fill="url(#${cid}m)"/>
        <circle cx="39" cy="25" r="13" fill="#0e1220"/></svg>`;
    }
    return `<svg width="${s}" height="${s}" viewBox="0 0 ${vb} ${vb}">${defs}
      <circle cx="33" cy="30" r="14" fill="url(#${cid}s)"/>
      <g stroke="#f4c869" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
      ${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;
        return `<line x1="${33+Math.cos(r)*20}" y1="${30+Math.sin(r)*20}"
          x2="${33+Math.cos(r)*25}" y2="${30+Math.sin(r)*25}"/>`;}).join('')}</g></svg>`;
  }

  // Ský (með eða án sólar/tungls fyrir 'partly')
  let sun='';
  if(kind==='partly'){
    sun = isNight
      ? `<circle cx="44" cy="22" r="10" fill="url(#${cid}m)"/><circle cx="49" cy="18" r="8.5" fill="#0e1220"/>`
      : `<circle cx="44" cy="22" r="11" fill="url(#${cid}s)"/>`;
  }
  const cloud=`<g filter="url(#${cid}ds)">
    <path d="M18 40 Q9 40 8 30 Q7 19 20 18 Q23 8 34 9 Q46 10 47 21
      Q59 20 59 31 Q59 40 47 40Z" fill="url(#${cid})"/>
    <path d="M18 40 Q9 40 8 30 Q7 19 20 18 Q23 8 34 9 Q46 10 47 21
      Q59 20 59 31 Q59 40 47 40Z" fill="url(#${cid}hl)"/></g>`;

  // Úrkoma - fjöldi eftir mm
  const n=precipCount(mm);
  let fall='';
  if(n>0 && (kind==='rain'||kind==='sleet'||kind==='snow')){
    const layout=fallLayout(n);
    let items=[];
    layout.forEach((row,ri)=>{
      const y0=46+ri*2;
      row.forEach((x,ci)=>{
        const delay=((ri*row.length+ci)*0.22).toFixed(2);
        if(kind==='snow' || (kind==='sleet' && (ri+ci)%2===1)){
          // snjókorn
          items.push(`<g stroke="#eaf2fc" stroke-width="1.6" stroke-linecap="round">
            <line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+7}"/>
            <line x1="${x-3.2}" y1="${y0+3.5}" x2="${x+3.2}" y2="${y0+3.5}"/>
            <line x1="${x-2.4}" y1="${y0+1}" x2="${x+2.4}" y2="${y0+6}"/>
            <line x1="${x-2.4}" y1="${y0+6}" x2="${x+2.4}" y2="${y0+1}"/>
            <animateTransform attributeName="transform" type="translate"
              values="0 -4;0 8" dur="2.4s" begin="${delay}s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0.3" dur="2.4s" begin="${delay}s" repeatCount="indefinite"/></g>`);
        } else {
          // dropi
          items.push(`<path d="M${x} ${y0} Q${x} ${y0-3} ${x+2.5} ${y0-3}
            Q${x+5} ${y0-3} ${x+5} ${y0} Q${x+5} ${y0+5} ${x+2.5} ${y0+8}
            Q${x} ${y0+5} ${x} ${y0}Z" fill="url(#${cid}rn)">
            <animateTransform attributeName="transform" type="translate"
              values="0 -3;0 7" dur="1s" begin="${delay}s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0" dur="1s" begin="${delay}s" repeatCount="indefinite"/></path>`);
        }
      });
    });
    fall=items.join('');
  }
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${vb} ${vb}">${defs}${sun}${cloud}${fall}</svg>`;
}

// ══ VINDTÁKN eftir styrk ══
function windSvg(ms,size){
  const s=size||44;
  const lines= ms<0.5?0 : ms<5?2 : ms<11?3 : 4;
  const dur= ms<5?3.2 : ms<11?2.0 : 1.1;
  const op= ms<5?0.72 : ms<11?0.88 : 1;
  if(lines===0) return `<svg width="${s}" height="${s}" viewBox="0 0 42 42" fill="none"
    stroke="#cdd6e6" stroke-width="2" stroke-linecap="round" opacity="0.5"><circle cx="21" cy="21" r="9"/></svg>`;
  const paths=['M6 14 H27 a4 4 0 1 0 -4 -4','M6 21 H31 a4 4 0 1 1 -4 4',
    'M6 28 H24 a3.5 3.5 0 1 1 -3 3','M6 35 H20 a3 3 0 1 0 -3 -3'].slice(0,lines);
  const streaks=paths.map((d,i)=>`<path d="${d}"><animate attributeName="opacity"
    values="${op};${op*0.5};${op}" dur="${dur}s" begin="${i*0.2}s" repeatCount="indefinite"/></path>`).join('');
  return `<svg width="${s}" height="${s}" viewBox="0 0 42 42" fill="none"
    stroke="#cdd6e6" stroke-width="2.2" stroke-linecap="round" opacity="${op}">${streaks}</svg>`;
}

// ══ TVÍÖRVA ÁTTAVITI ══
function buildCompass(nowDeg, laterDeg){
  const cx=95,cy=95,R=76;
  function arrow(ang,len,color,w,op,hl){
    const rad=(ang+180-90)*Math.PI/180; // +180: vísar þangað sem blæs
    const ex=cx+Math.cos(rad)*len, ey=cy+Math.sin(rad)*len;
    const bx=cx-Math.cos(rad)*(len*0.28), by=cy-Math.sin(rad)*(len*0.28);
    const hw=hl*0.6, perp=rad+Math.PI/2;
    const b1x=ex-Math.cos(rad)*hl+Math.cos(perp)*hw, b1y=ey-Math.sin(rad)*hl+Math.sin(perp)*hw;
    const b2x=ex-Math.cos(rad)*hl-Math.cos(perp)*hw, b2y=ey-Math.sin(rad)*hl-Math.sin(perp)*hw;
    return `<line x1="${bx}" y1="${by}" x2="${ex-Math.cos(rad)*hl*0.7}" y2="${ey-Math.sin(rad)*hl*0.7}"
      stroke="${color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>
      <path d="M${ex} ${ey} L${b1x} ${b1y} L${b2x} ${b2y} Z" fill="${color}" opacity="${op}"/>`;
  }
  const ticks=[0,45,90,135,180,225,270,315].map(a=>{const r=(a-90)*Math.PI/180;
    const r2=(a%90===0)?R-8:R-4;
    return `<line x1="${cx+Math.cos(r)*R}" y1="${cy+Math.sin(r)*R}"
      x2="${cx+Math.cos(r)*r2}" y2="${cy+Math.sin(r)*r2}"
      stroke="rgba(255,255,255,0.16)" stroke-width="1.3"/>`;}).join('');
  return `<svg viewBox="0 0 190 190" width="100%" height="100%">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.3"/>
    ${ticks}
    <text x="${cx}" y="22" fill="#9aa2b4" font-size="12" text-anchor="middle" font-weight="500">N</text>
    <text x="${cx}" y="176" fill="#646d82" font-size="12" text-anchor="middle">S</text>
    <text x="18" y="${cy+4}" fill="#646d82" font-size="12" text-anchor="middle">V</text>
    <text x="172" y="${cy+4}" fill="#646d82" font-size="12" text-anchor="middle">A</text>
    ${laterDeg!=null?arrow(laterDeg,R-22,'#8b93a7',2.6,0.5,13):''}
    ${arrow(nowDeg,R-16,'#ffffff',3.2,1,16)}
    <circle cx="${cx}" cy="${cy}" r="3.5" fill="#fff"/></svg>`;
}

// ══ DAG/NÓTT BAKGRUNNUR eftir tíma ══
const SKY={
  nott:    {a:'#080b12',b:'#0d1220',c:'#141a2e',glow:'rgba(90,110,170,0.10)'},
  dogun:   {a:'#141220',b:'#241d30',c:'#3a2f42',glow:'rgba(180,140,180,0.14)'},
  dagur:   {a:'#0e1220',b:'#141a2e',c:'#1b2138',glow:'rgba(120,140,200,0.12)'},
  kvold:   {a:'#12101c',b:'#1a1626',c:'#241d30',glow:'rgba(150,120,170,0.13)'},
};
function skyPhase(h){ return h<6?'nott':h<9?'dogun':h<18?'dagur':h<21?'kvold':'nott'; }
function applySky(h){
  const s=SKY[skyPhase(h)];const r=document.documentElement.style;
  r.setProperty('--sky-a',s.a);r.setProperty('--sky-b',s.b);
  r.setProperty('--sky-c',s.c);r.setProperty('--glow',s.glow);
}
function isNightHour(h){const p=skyPhase(h);return p==='nott';}

// ══ SÆKJA JOLLY GÖGN ══
async function load(){
  let FC;
  try{ FC=await (await fetch(FC_URL,{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('heroTemp').textContent='—';
    document.getElementById('heroDesc').textContent='Næ ekki í spá'; return; }
  render(FC);
}

function fmtHour(iso){
  const d=new Date(iso);
  return String(d.getHours()).padStart(2,'0');
}
const DAGAR=['Sunnudagur','Mánudagur','Þriðjudagur','Miðvikudagur','Fimmtudagur','Föstudagur','Laugardagur'];

function render(FC){
  const H=FC.hourly||{};
  const T=H.temperature||[], W=H.windspeed||[], D=H.winddirection||[],
        P=H.precipitation||[], C=H.cloud_cover||[], times=H.time||[];
  const nowH=new Date().getHours();
  applySky(nowH);

  // ── NÚNA ──
  const t0=Math.round(T[0]??0);
  const c0=C[0], p0=P[0]||0, w0=W[0]||0, d0=D[0]??0;
  const kind0=wxKind(c0,p0,t0);
  document.getElementById('heroIcon').innerHTML=wxIcon(120,kind0,p0,isNightHour(nowH));
  document.getElementById('heroTemp').textContent=t0;
  const descMap={clear:'Heiðskírt',partly:'Léttskýjað',cloudy:'Skýjað',
    rain:'Rigning',sleet:'Slydda',snow:'Snjókoma'};
  document.getElementById('heroDesc').textContent=
    `${descMap[kind0]||'Skýjað'}${c0!=null?' · '+Math.round(c0)+'% ský':''}`;

  // ── VINDUR ──
  document.getElementById('windIcon').innerHTML=windSvg(w0,44);
  document.getElementById('windVal').innerHTML=`${w0.toFixed(1)}<span class="u">m/s</span>`;

  // ── ÁTTAVITI: núna + 6 klst ──
  const d6=D[6]??d0, w6=W[6]??w0;
  document.getElementById('compass').innerHTML=buildCompass(d0,d6);
  document.getElementById('cNow').textContent=`${degToDir(d0)} ${w0.toFixed(1)} m/s`;
  document.getElementById('cLater').textContent=`+6 klst · ${degToDir(d6)} ${w6.toFixed(1)} m/s`;

  // ── ÚRKOMA ──
  document.getElementById('precipIcon').innerHTML=
    p0>0 ? wxIcon(50,kind0,p0,isNightHour(nowH)) : wxIcon(50,'cloudy',0,isNightHour(nowH));
  document.getElementById('precipVal').innerHTML=`${p0.toFixed(1)}<span class="u">mm</span>`;

  // ── KLUKKUSTUNDASPÁ (24 klst) ──
  let hh='';
  for(let i=0;i<Math.min(24,times.length);i++){
    const hr=fmtHour(times[i]);
    const kind=wxKind(C[i],P[i]||0,Math.round(T[i]??0));
    const night=isNightHour(new Date(times[i]).getHours());
    hh+=`<div class="hcell${i===0?' now':''}">
      <div class="h">${i===0?'núna':hr}</div>
      <div class="ic">${wxIcon(36,kind,P[i]||0,night)}</div>
      <div class="t">${Math.round(T[i]??0)}°</div>
      <div class="wa">${windArrow(D[i]??0,11)}</div>
      <div class="p">${(P[i]||0)>0?(P[i]).toFixed(1):''}</div>
    </div>`;
  }
  document.getElementById('hrow').innerHTML=hh;

  // ── DAGASPÁ ──
  renderDays(FC);

  // ── Heimild ──
  document.getElementById('foot').innerHTML=
    `<span>Jolly ${FC.model_name?FC.model_name.replace('Jolly ',''):''}</span> · `+
    `Veðurstofa Íslands · MET Norway · Open-Meteo`;
}

function renderDays(FC){
  // Nota daily_slots ef til, annars reikna úr klukkustundum
  const daily=FC.daily||{};
  const dates=daily.date||[];
  const slots=FC.daily_slots||[];
  const H=FC.hourly||{};

  // Safna klst per dag fyrir min/max vind, ríkjandi átt, heildarúrkomu
  const byDay={};
  (H.time||[]).forEach((t,i)=>{
    const day=t.slice(0,10);
    (byDay[day]=byDay[day]||[]).push(i);
  });

  let out='';
  dates.slice(0,6).forEach((d,di)=>{
    const idxs=byDay[d]||[];
    const temps=idxs.map(i=>H.temperature[i]).filter(x=>x!=null);
    const winds=idxs.map(i=>H.windspeed[i]).filter(x=>x!=null);
    const precs=idxs.map(i=>H.precipitation[i]||0);
    const dirs =idxs.map(i=>H.winddirection[i]).filter(x=>x!=null);
    const clouds=idxs.map(i=>H.cloud_cover[i]).filter(x=>x!=null);

    const hi=daily.temp_max?.[di] ?? (temps.length?Math.max(...temps):null);
    const lo=daily.temp_min?.[di] ?? (temps.length?Math.min(...temps):null);
    const rain=daily.precipitation_total?.[di] ?? precs.reduce((a,b)=>a+b,0);
    const wmin=winds.length?Math.min(...winds):0, wmax=winds.length?Math.max(...winds):0;
    // ríkjandi átt: hringmeðaltal
    let dirDeg=daily.wind_dir_dominant_deg?.[di];
    if(dirDeg==null && dirs.length){
      const ss=dirs.reduce((a,x)=>a+Math.sin(x*Math.PI/180),0);
      const cc=dirs.reduce((a,x)=>a+Math.cos(x*Math.PI/180),0);
      dirDeg=(Math.atan2(ss,cc)*180/Math.PI+360)%360;
    }
    dirDeg=dirDeg||0;

    // 3 tákn: morgunn(9) / dagur(15) / kvöld(21) - úr slots eða klst
    function slotKind(hh){
      const key=`${d}T${String(hh).padStart(2,'0')}:00`;
      const i=(H.time||[]).indexOf(key);
      if(i<0) return {kind:'cloudy',mm:0,night:hh<6||hh>=21};
      return {kind:wxKind(H.cloud_cover[i],H.precipitation[i]||0,Math.round(H.temperature[i]??0)),
        mm:H.precipitation[i]||0, night:hh<6||hh>=21};
    }
    const evo=[slotKind(9),slotKind(15),slotKind(21)];

    const dt=new Date(d+'T12:00:00');
    const dname=di===0?'Í dag':di===1?'Á morgun':DAGAR[dt.getDay()];

    out+=`<div class="day${di===0?' open':''}" onclick="this.classList.toggle('open')">
      <div class="dhead">
        <div><div class="dname">${dname}</div>
          <div class="dp">${rain>0?rain.toFixed(1)+' mm':''}</div></div>
        <div class="dicons">
          ${wxIcon(28,evo[0].kind,evo[0].mm,evo[0].night)}
          ${wxIcon(28,evo[1].kind,evo[1].mm,evo[1].night)}
          ${wxIcon(28,evo[2].kind,evo[2].mm,evo[2].night)}
        </div>
        <div class="dwind">${windArrow(dirDeg,13)}</div>
        <div class="dtemp"><b>${hi!=null?Math.round(hi):'–'}°</b>
          <span class="lo">${lo!=null?Math.round(lo):'–'}°</span></div>
        <div class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
      <div class="ddetail"><div class="ddin">
        <div class="dstat"><span class="k">Hiti</span>
          <span class="v">${lo!=null?Math.round(lo):'–'}° – ${hi!=null?Math.round(hi):'–'}°</span></div>
        <div class="dstat"><span class="k">Ríkjandi átt</span>
          <span class="v">${windArrow(dirDeg,14)} ${degToDir(dirDeg)}</span></div>
        <div class="dstat"><span class="k">Vindur</span>
          <span class="v">${wmin.toFixed(1)} – ${wmax.toFixed(1)} m/s</span></div>
        <div class="dstat"><span class="k">Úrkoma</span>
          <span class="v">${rain>0?rain.toFixed(1)+' mm':'Þurrt'}</span></div>
      </div></div>
    </div>`;
  });
  document.getElementById('days').innerHTML=out;
}

load();
</script>
</body></html>
