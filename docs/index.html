<!DOCTYPE html>
<html lang="is"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jolly · Egilsstaðir</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#f4f6fa;--sub:#9aa2b4;--faint:#646d82;
    --card:rgba(255,255,255,0.055);--card-top:rgba(255,255,255,0.11);
    --edge:rgba(255,255,255,0.10);--chill:#aac6ea;
    --sky-a:#0e1220;--sky-b:#141a2e;--sky-c:#1b2138;--glow:rgba(120,140,200,0.12);
  }
  html,body{height:100%}
  body{font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;
    color:var(--ink);background:#0a0d14;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;font-feature-settings:"tnum";
    padding-bottom:46px}
  .sky{position:fixed;inset:0;z-index:-2;transition:background 2s ease;
    background:radial-gradient(140% 90% at 50% -20%,var(--sky-c) 0%,transparent 55%),
      linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,var(--sky-c) 100%)}
  .glow{position:fixed;top:-15%;left:50%;transform:translateX(-50%);
    width:120%;height:45%;z-index:-1;pointer-events:none;transition:background 2s ease;
    background:radial-gradient(60% 100% at 50% 0%,var(--glow),transparent 70%)}
  .wrap{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px 0}

  .loc{text-align:center;margin-bottom:22px}
  .loc h1{font-size:33px;font-weight:300;letter-spacing:-.01em}
  .loc .region{font-size:14px;color:var(--sub);margin-top:3px;
    display:inline-flex;align-items:center;gap:5px}
  .loc .region svg{width:12px;height:12px;opacity:.7}

  .card{position:relative;
    background:linear-gradient(180deg,var(--card-top),var(--card) 40%);
    border-radius:26px;border:1px solid var(--edge);
    box-shadow:0 1px 0 rgba(255,255,255,0.10) inset,
      0 -20px 40px rgba(0,0,0,0.18) inset,0 12px 34px rgba(0,0,0,0.30);
    backdrop-filter:blur(24px) saturate(1.5);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);overflow:hidden}

  .hero{display:flex;align-items:center;gap:6px;padding:22px 24px;margin-bottom:12px}
  .hero .icon{width:120px;height:120px;flex-shrink:0;margin-left:-6px;position:relative}
  .hero .icon .hwind{position:absolute;right:-10px;bottom:4px;pointer-events:none;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
  .stat .gust{margin-top:8px;font-size:12px;color:#f0b35a;text-align:center;line-height:1.35}
  .stat .gust b{font-weight:600}
  .hero .right{margin-left:auto;text-align:right}
  .hero .temp{font-size:84px;font-weight:200;line-height:.92;letter-spacing:-.03em}
  .hero .temp::after{content:"°";font-weight:200;color:var(--chill);opacity:.7}
  .hero .desc{font-size:14px;color:var(--sub);margin-top:4px}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;
    margin-bottom:12px;align-items:stretch}
  .stat{padding:16px 12px 13px;display:flex;flex-direction:column}
  /* Dauda plassid nedst nytt fyrir naestu 6 klst */
  .n6{margin-top:auto;padding-top:10px;
    border-top:1px solid rgba(255,255,255,0.07);
    font-size:11px;color:var(--faint);text-align:center;line-height:1.5}
  .n6 b{color:var(--sub);font-weight:600;font-size:12px}
  .n6 .t{color:var(--chill)}
  .n6.empty{color:rgba(255,255,255,0.22)}
  .stat .lbl{font-size:12px;color:var(--sub);margin-bottom:12px}
  .stat .mid{height:58px;display:flex;align-items:center;justify-content:center}
  .stat .val{font-size:18px;font-weight:400;margin-top:11px;text-align:center}
  .stat .val .u{font-size:12px;color:var(--sub);margin-left:2px}

  .compass{width:128px;height:128px}
  .stat .mid.cmid{height:132px}
  .cnow{font-size:18px;font-weight:400;text-align:center;margin-top:11px}
  .clater{font-size:11px;color:var(--faint);text-align:center;margin-top:2px}

  .sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:22px 6px 11px}

  .hourly{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;padding:16px 8px}
  .hourly::-webkit-scrollbar{display:none}
  .hrow{display:inline-flex;gap:2px}
  .hcell{flex:0 0 auto;width:58px;text-align:center;padding:5px 0}
  .hcell .h{font-size:12px;color:var(--sub);margin-bottom:10px}
  .hcell.now .h{color:var(--ink);font-weight:600}
  .hcell .cc{font-size:10px;color:var(--faint);height:12px;margin-bottom:2px}
  .hcell .ic{height:38px;display:flex;align-items:center;justify-content:center}
  .hcell .p{font-size:10px;color:var(--chill);height:12px;margin-bottom:6px;opacity:.85}
  .hcell .t{font-size:16px;font-weight:400}
  .hcell .wa{display:flex;justify-content:center;align-items:center;gap:3px;margin-top:6px;height:12px}
  .hcell .wa .ws{font-size:11px;color:var(--sub)}

  .days{padding:5px}
  .day{border-radius:19px;overflow:hidden;transition:background .2s}
  .day.open{background:rgba(255,255,255,0.03)}
  .day+.day{margin-top:2px}
  .dhead{display:grid;grid-template-columns:64px 1fr auto auto auto;
    align-items:center;gap:10px;padding:13px 13px;cursor:pointer}
  .dhead .dname{font-size:14px;font-weight:400}
  .dhead .dp{font-size:11px;color:var(--chill);opacity:.8;margin-top:2px;height:13px}
  .dhead .dicons{display:flex;gap:2px;justify-content:center}
  .dhead .dwind{display:flex;align-items:center;justify-content:center;opacity:.9}
  .dhead .dtemp{text-align:right;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dhead .dtemp .lo{color:var(--sub)}
  .dhead .chev{width:15px;color:var(--faint);transition:transform .25s;
    display:flex;align-items:center;justify-content:center}
  .day.open .chev{transform:rotate(180deg)}
  .ddetail{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .day.open .ddetail{max-height:200px}
  .ddin{padding:4px 15px 16px;display:grid;grid-template-columns:1fr 1fr;
    gap:13px 18px;border-top:1px solid rgba(255,255,255,0.06);margin-top:2px}
  .dstat{display:flex;flex-direction:column;gap:5px;padding-top:11px}
  .dstat .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .dstat .v{font-size:15px;font-weight:400;display:flex;align-items:center;gap:7px}


  /* ── Næstu dagar v2 ── */
  .days{padding:6px}
  .dcard{border-radius:18px;background:rgba(255,255,255,0.03);padding:10px 8px 8px;margin-bottom:7px}
  .dcard:last-child{margin-bottom:0}
  .dtop{display:grid;grid-template-columns:54px 1fr 24px;align-items:start;cursor:pointer}
  .dn{padding-top:16px}
  .dname{font-size:16px;font-weight:600;color:var(--ink)}
  .ddate{font-size:11px;color:var(--sub);margin-top:2px}
  .pcols,.pxrow{display:grid;grid-template-columns:repeat(4,1fr)}
  .pc{text-align:center}
  .pc.past,.px.past{opacity:.42}
  .pl{font-size:10px;color:var(--faint);white-space:nowrap;height:13px}
  .pi{height:42px;display:flex;align-items:center;justify-content:center;margin:2px 0}
  .pt{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
  .chev{color:var(--faint);display:flex;justify-content:center;padding-top:18px;transition:transform .25s}
  .dcard.open .chev{transform:rotate(180deg)}
  .dcurve{margin-left:54px;margin-right:24px;height:26px}
  .tcurve{width:100%;height:26px;display:block}
  .dopen{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .dcard.open .dopen{max-height:420px}
  .pxrow{margin-left:54px;margin-right:24px;padding-top:4px}
  .px{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
  .pp{font-size:11px;color:var(--faint)}
  .pp.wet{color:#7fb3ff;font-weight:600}
  .pw{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub)}
  .gst{font-size:10px;padding:2px 6px;border-radius:9px;background:rgba(240,179,90,.16);color:#f0b35a;white-space:nowrap}
  .gst.red{background:rgba(255,95,85,.18);color:#ff7a70}
  .dsum{margin:10px 6px 2px;border-top:1px solid rgba(255,255,255,0.06)}
  .sr{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;
    border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;color:var(--sub)}
  .sr:last-child{border-bottom:0}
  .sr b{font-weight:600;color:var(--ink)} .sr b i{font-style:normal}
  .sr b.wet{color:#7fb3ff} .sr b.gor{color:#f0b35a} .sr b.gred{color:#ff7a70}
  .foot{text-align:center;font-size:11px;color:rgba(255,255,255,0.22);
    margin-top:26px;line-height:1.7}
  .foot span{color:var(--faint)}

  .nanar-link{
    display:flex;align-items:center;justify-content:center;gap:7px;
    margin:18px auto 0;padding:13px 22px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:18px;
    color:var(--sub);font-size:13px;font-weight:400;
    text-decoration:none;width:fit-content;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    transition:all .2s;
  }
  .nanar-link:hover{background:rgba(255,255,255,0.08);color:var(--ink)}
  .nanar-link svg{opacity:.6}
</style></head>
<body>
  <div class="sky" id="sky"></div><div class="glow" id="glow"></div>
  <div class="wrap">
    <div class="loc">
      <h1>Egilsstaðir</h1>
      <div class="region">Austurland, Ísland
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
    </div>

    <div class="card hero">
      <div class="icon" id="heroIcon"></div>
      <div class="right">
        <div class="temp" id="heroTemp">–</div>
        <div class="desc" id="heroDesc">–</div>
      </div>
    </div>

    <div class="stats">
      <div class="card stat">
        <div class="lbl">Vindátt</div>
        <div class="mid cmid"><div class="compass" id="compass"></div></div>
        <div class="cnow" id="cNow">–</div>
        <div class="clater" id="cLater"></div>
        <div class="clater" id="cLater12"></div>
        <div class="gust" id="cGust"></div>
      </div>
      <div class="card stat">
        <div class="lbl">Úrkoma</div>
        <div class="mid" id="precipIcon"></div>
        <div class="val" id="precipVal">–</div>
        <div class="n6" id="precipNext6"></div>
      </div>
    </div>

    <div class="sec">Klukkustundaspá</div>
    <div class="card hourly"><div class="hrow" id="hrow"></div></div>

    <div class="sec">Næstu dagar</div>
    <div class="card days" id="days"></div>

    <div class="foot" id="foot"></div>

    <a class="nanar-link" href="nanar.html">
      <span>Nánari upplýsingar</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>
<script>
const FC_URL='https://raw.githubusercontent.com/Blodnasir10/jolly-weather/main/docs/data/jolly_forecast.json';

// ══ VINDÁTTAR-ÖR (vísar þangað sem vindur blæs: átt+180) ══
const WDEG={N:0,NNA:22.5,NA:45,ANA:67.5,A:90,ASA:112.5,SA:135,SSA:157.5,
  S:180,SSV:202.5,SV:225,VSV:247.5,V:270,VNV:292.5,NV:315,NNV:337.5};
function degToDir(d){const n=['N','NNA','NA','ANA','A','ASA','SA','SSA','S','SSV','SV','VSV','V','VNV','NV','NNV'];
  return n[Math.round(((d%360)/22.5))%16];}
// Námundað að næsta hálfa: 1 · 1,5 · 2 (aldrei "1,0")
function fmtHalf(x){ const r=Math.round((x||0)*2)/2; return (r%1===0?String(r):String(r).replace('.',',')); }
// Úrkoma: einn aukastafur, en aldrei "0.0" (sýnt sem 0)
function fmtRain(x){ const r=Math.round((x||0)*10)/10; return r===0?'0':r.toFixed(1); }

function windArrow(deg,size){
  const s=size||11;const ang=(deg+180)%360;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24"
    style="transform:rotate(${ang}deg)" fill="none">
    <path d="M12 3 L12 21 M12 3 L7 9 M12 3 L17 9" stroke="#aac6ea"
      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/></svg>`;
}

// ══ VEÐURTÁKN ══
// kind ræðst af skýjahulu + úrkomu + hita. dropar/korn = fjöldi úr mm.
function precipCount(mm){ return mm<=0 ? 0 : Math.min(6, Math.ceil(mm)); }

function wxKind(cloud, precip, temp){
  if(precip>=0.1){
    if(temp<=-1) return 'snow';
    if(temp<3)   return 'sleet';
    return 'rain';
  }
  // Thurrt: skila 'dry' - wxIcon notar tha skyjahulu-threpin beint.
  return 'dry';
}

// Raðar n dropum/kornum undir skýið á fallegan hátt (1-6)
function fallLayout(n){
  // x-hnit fyrir 1..6 stykki, miðjað undir skýi (viewBox 66 breitt)
  const rows={1:[[33]],2:[[26,40]],3:[[24,33,42]],
    4:[[26,40],[33,47]],5:[[24,33,42],[29,38]],6:[[24,33,42],[27,36,45]]};
  return rows[n]||rows[6];
}

let _iconSeq=0;
// ── SKÝJAHULA í 10 þrepum (þegar þurrt) ──────────────────────
function cloudCoverIcon(size, cover, isNight){
  const s=size, id=`cc${++_iconSeq}`;
  const defs=`<defs>
    <radialGradient id="${id}sun" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.55" stop-color="#fbc45e"/>
      <stop offset="1" stop-color="#f0a848"/></radialGradient>
    <radialGradient id="${id}moon" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#dfe4ec"/></radialGradient>
    <linearGradient id="${id}cl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f4fb"/><stop offset="0.5" stop-color="#d4dcea"/>
      <stop offset="1" stop-color="#aeb9cd"/></linearGradient>
    <radialGradient id="${id}hl" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="${id}ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000" flood-opacity="0.20"/></filter>
  </defs>`;
  const cx=60, cy=52;
  const bodyVisible = cover < 85;
  const bodyOpacity = cover<=10 ? 1 : cover<40 ? 0.95 : cover<60 ? 0.7 : cover<75 ? 0.4 : 0.15;
  let body='';
  if(bodyVisible){
    if(isNight){
      body=`<g opacity="${bodyOpacity}">
        <circle cx="${cx+7}" cy="${cy-10}" r="15" fill="url(#${id}moon)"/>
        <circle cx="${cx+13}" cy="${cy-14}" r="12.5" fill="#0e1220" opacity="0.92"/></g>`;
    } else {
      body=`<g opacity="${bodyOpacity}">
        <circle cx="${cx+6}" cy="${cy-10}" r="15" fill="url(#${id}sun)"/></g>`;
    }
  }
  function puff(px, py, r){
    return `<g filter="url(#${id}ds)">
      <ellipse cx="${px}" cy="${py}" rx="${r*1.15}" ry="${r}" fill="url(#${id}cl)"/>
      <ellipse cx="${px}" cy="${py}" rx="${r*1.15}" ry="${r}" fill="url(#${id}hl)"/></g>`;
  }
  function fullCloud(){
    return `<g filter="url(#${id}ds)">
      <path d="M32 74 Q16 74 14 58 Q12 40 34 39 Q38 24 60 25 Q82 26 85 42
        Q104 40 105 60 Q106 74 88 74Z" fill="url(#${id}cl)"/>
      <path d="M32 74 Q16 74 14 58 Q12 40 34 39 Q38 24 60 25 Q82 26 85 42
        Q104 40 105 60 Q106 74 88 74Z" fill="url(#${id}hl)"/></g>`;
  }
  let clouds='';
  if(cover<10){
    clouds='';
  } else if(cover<80){
    let n, baseR, spread, yBase;
    if(cover<20){      n=1; baseR=11; spread=0;  yBase=68; }
    else if(cover<30){ n=2; baseR=12; spread=26; yBase=68; }
    else if(cover<40){ n=2; baseR=14; spread=20; yBase=70; }
    else if(cover<50){ n=3; baseR=14; spread=22; yBase=70; }
    else if(cover<60){ n=3; baseR=16; spread=18; yBase=71; }
    else if(cover<70){ n=4; baseR=16; spread=17; yBase=72; }
    else             { n=4; baseR=18; spread=14; yBase=72; }
    const startX = cx - spread*(n-1)/2;
    let puffs=[];
    for(let i=0;i<n;i++){
      const yj = (i%2===0)? 0 : -3;
      puffs.push(puff(startX + i*spread, yBase+yj, baseR + (i===Math.floor(n/2)?2:0)));
    }
    clouds=puffs.join('');
  } else {
    clouds=fullCloud();
    if(cover>=90){
      clouds += `<ellipse cx="46" cy="60" rx="30" ry="16" fill="url(#${id}cl)" opacity="0.5"/>`;
    }
  }
  return `<svg width="${s}" height="${s}" viewBox="0 0 120 100">${defs}${body}${clouds}</svg>`;
}

function wxIcon(size, kind, mm, isNight, cover){
  const s=size, vb=66;
  const cid=`c${++_iconSeq}`;
  const defs=`<defs>
    <linearGradient id="${cid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/><stop offset="0.5" stop-color="#d4dcea"/>
      <stop offset="1" stop-color="#aeb9cd"/></linearGradient>
    <linearGradient id="${cid}d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8d1e0"/><stop offset="1" stop-color="#94a0b6"/></linearGradient>
    <radialGradient id="${cid}s" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#f4c869"/></radialGradient>
    <radialGradient id="${cid}m" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#eef2fb"/><stop offset="1" stop-color="#c2cde0"/></radialGradient>
    <radialGradient id="${cid}hl" cx="0.35" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="${cid}ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/></filter>
    <linearGradient id="${cid}rn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2d8f2"/><stop offset="1" stop-color="#8fb4e2"/></linearGradient>
  </defs>`;

  // ÞURRT: nota 10-þrepa skýjahulu-táknið (sól/tungl + hnoðrar eftir hulu)
  if(kind==='dry'){
    return cloudCoverIcon(size, (cover==null?0:cover), isNight);
  }
  const cloud=`<g filter="url(#${cid}ds)">
    <path d="M18 40 Q9 40 8 30 Q7 19 20 18 Q23 8 34 9 Q46 10 47 21
      Q59 20 59 31 Q59 40 47 40Z" fill="url(#${cid})"/>
    <path d="M18 40 Q9 40 8 30 Q7 19 20 18 Q23 8 34 9 Q46 10 47 21
      Q59 20 59 31 Q59 40 47 40Z" fill="url(#${cid}hl)"/></g>`;

  // Úrkoma - fjöldi eftir mm
  const n=precipCount(mm);
  let fall='';
  if(n>0 && (kind==='rain'||kind==='sleet'||kind==='snow')){
    const layout=fallLayout(n);
    let items=[];
    layout.forEach((row,ri)=>{
      const y0=46+ri*2;
      row.forEach((x,ci)=>{
        const delay=((ri*row.length+ci)*0.22).toFixed(2);
        if(kind==='snow' || (kind==='sleet' && (ri+ci)%2===1)){
          // snjókorn
          items.push(`<g stroke="#eaf2fc" stroke-width="1.6" stroke-linecap="round">
            <line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+7}"/>
            <line x1="${x-3.2}" y1="${y0+3.5}" x2="${x+3.2}" y2="${y0+3.5}"/>
            <line x1="${x-2.4}" y1="${y0+1}" x2="${x+2.4}" y2="${y0+6}"/>
            <line x1="${x-2.4}" y1="${y0+6}" x2="${x+2.4}" y2="${y0+1}"/>
            <animateTransform attributeName="transform" type="translate"
              values="0 -4;0 8" dur="2.4s" begin="${delay}s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0.3" dur="2.4s" begin="${delay}s" repeatCount="indefinite"/></g>`);
        } else {
          // dropi
          items.push(`<path d="M${x} ${y0} Q${x} ${y0-3} ${x+2.5} ${y0-3}
            Q${x+5} ${y0-3} ${x+5} ${y0} Q${x+5} ${y0+5} ${x+2.5} ${y0+8}
            Q${x} ${y0+5} ${x} ${y0}Z" fill="url(#${cid}rn)">
            <animateTransform attributeName="transform" type="translate"
              values="0 -3;0 7" dur="1s" begin="${delay}s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0" dur="1s" begin="${delay}s" repeatCount="indefinite"/></path>`);
        }
      });
    });
    fall=items.join('');
  }
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${vb} ${vb}">${defs}${cloud}${fall}</svg>`;
}

// ══ VINDTÁKN eftir styrk ══
function windSvg(ms,size){
  // Kvardi: 1-5 = 1 strik, 5-10 = 2, 10-15 = 3, 15+ = 4 og hreyfing.
  // Hreyfing ADEINS vid 15+ svo hun thydi eitthvad thegar hun birtist.
  const s=size||44;
  const n = ms<1 ? 0 : ms<5 ? 1 : ms<10 ? 2 : ms<15 ? 3 : 4;
  const moving = ms>=15;
  if(n===0) return `<svg width="${s}" height="${s}" viewBox="0 0 42 42" fill="none"
    stroke="#cdd6e6" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <circle cx="21" cy="21" r="8"/></svg>`;
  const paths=['M7 13 H26 a3.6 3.6 0 1 0 -3.6 -3.6',
               'M7 21 H30 a3.6 3.6 0 1 1 -3.6 3.6',
               'M7 29 H24 a3.2 3.2 0 1 1 -3.2 3.2',
               'M7 36 H20 a2.8 2.8 0 1 0 -2.8 -2.8'];
  const op = ms<5?0.7 : ms<10?0.82 : ms<15?0.92 : 1;
  const streaks=paths.slice(0,n).map((d,i)=>{
    const a = moving ? `<animate attributeName="opacity"
      values="${op};${op*0.45};${op}" dur="0.9s" begin="${i*0.15}s"
      repeatCount="indefinite"/>` : '';
    return `<path d="${d}">${a}</path>`;}).join('');
  return `<svg width="${s}" height="${s}" viewBox="0 0 42 42" fill="none"
    stroke="#cdd6e6" stroke-width="2.2" stroke-linecap="round"
    opacity="${op}">${streaks}</svg>`;
}

// ── NAESTU 6 KLST: nytir dauda plassid nedst i reitunum ──
function next6Wind(W, times, from){
  const w6=[], t6=[];
  for(let k=from;k<Math.min(from+6,W.length);k++){
    if(W[k]!=null){ w6.push(W[k]); t6.push(times[k]); }
  }
  if(!w6.length) return '';
  const mx=Math.max(...w6);
  const at=t6[w6.indexOf(mx)];
  const hh=at?new Date(at).getHours():null;
  return `næstu 6 klst<br><b>mest ${Math.round(mx)} m/s</b>`
    + (hh!=null?` <span class="t">kl. ${String(hh).padStart(2,'0')}</span>`:'');
}
function next6Rain(P, times, from){
  const p6=[], t6=[];
  for(let k=from;k<Math.min(from+6,P.length);k++){
    p6.push(P[k]||0); t6.push(times[k]);
  }
  if(!p6.length) return {html:'', empty:true};
  const tot=p6.reduce((a,b)=>a+b,0);
  if(tot<0.1) return {html:'næstu 6 klst<br>þurrt', empty:true};
  const fi=p6.findIndex(v=>v>=0.1);
  const hh=fi>=0&&t6[fi]?new Date(t6[fi]).getHours():null;
  return {html:`næstu 6 klst<br><b>${tot.toFixed(1)} mm</b>`
    + (hh!=null?` · frá <span class="t">kl. ${String(hh).padStart(2,'0')}</span>`:''),
    empty:false};
}

// ══ TVÍÖRVA ÁTTAVITI ══
function buildCompass(nowDeg, laterDeg){
  const cx=95,cy=95,R=76;
  function arrow(ang,len,color,w,op,hl){
    const rad=(ang+180-90)*Math.PI/180; // +180: vísar þangað sem blæs
    const ex=cx+Math.cos(rad)*len, ey=cy+Math.sin(rad)*len;
    const bx=cx-Math.cos(rad)*(len*0.28), by=cy-Math.sin(rad)*(len*0.28);
    const hw=hl*0.6, perp=rad+Math.PI/2;
    const b1x=ex-Math.cos(rad)*hl+Math.cos(perp)*hw, b1y=ey-Math.sin(rad)*hl+Math.sin(perp)*hw;
    const b2x=ex-Math.cos(rad)*hl-Math.cos(perp)*hw, b2y=ey-Math.sin(rad)*hl-Math.sin(perp)*hw;
    return `<line x1="${bx}" y1="${by}" x2="${ex-Math.cos(rad)*hl*0.7}" y2="${ey-Math.sin(rad)*hl*0.7}"
      stroke="${color}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>
      <path d="M${ex} ${ey} L${b1x} ${b1y} L${b2x} ${b2y} Z" fill="${color}" opacity="${op}"/>`;
  }
  const ticks=[0,45,90,135,180,225,270,315].map(a=>{const r=(a-90)*Math.PI/180;
    const r2=(a%90===0)?R-8:R-4;
    return `<line x1="${cx+Math.cos(r)*R}" y1="${cy+Math.sin(r)*R}"
      x2="${cx+Math.cos(r)*r2}" y2="${cy+Math.sin(r)*r2}"
      stroke="rgba(255,255,255,0.16)" stroke-width="1.3"/>`;}).join('');
  return `<svg viewBox="0 0 190 190" width="100%" height="100%">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.3"/>
    ${ticks}
    <text x="${cx}" y="22" fill="#9aa2b4" font-size="12" text-anchor="middle" font-weight="500">N</text>
    <text x="${cx}" y="176" fill="#646d82" font-size="12" text-anchor="middle">S</text>
    <text x="18" y="${cy+4}" fill="#646d82" font-size="12" text-anchor="middle">V</text>
    <text x="172" y="${cy+4}" fill="#646d82" font-size="12" text-anchor="middle">A</text>
    ${nowDeg!=null?arrow(nowDeg,R-16,'#ffffff',3.2,1,16):''}
    <circle cx="${cx}" cy="${cy}" r="3.5" fill="#fff"/></svg>`;
}

// ══ DAG/NÓTT BAKGRUNNUR eftir tíma ══
const SKY={
  nott:    {a:'#080b12',b:'#0d1220',c:'#141a2e',glow:'rgba(90,110,170,0.10)'},
  dogun:   {a:'#141220',b:'#241d30',c:'#3a2f42',glow:'rgba(180,140,180,0.14)'},
  dagur:   {a:'#0e1220',b:'#141a2e',c:'#1b2138',glow:'rgba(120,140,200,0.12)'},
  kvold:   {a:'#12101c',b:'#1a1626',c:'#241d30',glow:'rgba(150,120,170,0.13)'},
};
function skyPhase(h){ return h<6?'nott':h<9?'dogun':h<18?'dagur':h<21?'kvold':'nott'; }
function applySky(h){
  const s=SKY[skyPhase(h)];const r=document.documentElement.style;
  r.setProperty('--sky-a',s.a);r.setProperty('--sky-b',s.b);
  r.setProperty('--sky-c',s.c);r.setProperty('--glow',s.glow);
}
function isNightHour(h){const p=skyPhase(h);return p==='nott';}

// ══ SÆKJA JOLLY GÖGN ══
async function load(){
  let FC;
  try{ FC=await (await fetch(FC_URL,{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('heroTemp').textContent='—';
    document.getElementById('heroDesc').textContent='Næ ekki í spá'; return; }
  render(FC);
}

function fmtHour(iso){
  const d=new Date(iso);
  return String(d.getHours()).padStart(2,'0');
}
const DAGAR=['Sunnudagur','Mánudagur','Þriðjudagur','Miðvikudagur','Fimmtudagur','Föstudagur','Laugardagur'];

function render(FC){
  const H=FC.hourly||{};
  const T=H.temperature||[], W=H.windspeed||[], D=H.winddirection||[],
        P=H.precipitation||[], C=H.cloud_cover||[], times=H.time||[];
  const nowH=new Date().getHours();
  applySky(nowH);

  // ── NÚNA ──
  const t0=Math.round(T[0]??0);
  const c0=C[0], p0=P[0]||0, w0=W[0]||0, d0=D[0]??0;
  const kind0=wxKind(c0,p0,t0);
  // Vindtákn ofan á skýjamyndinni - sömu reglur og áður (windSvg eftir styrk)
  document.getElementById('heroIcon').innerHTML=wxIcon(120,kind0,p0,isNightHour(nowH),c0)
    + `<div class="hwind">${windSvg(w0,54)}</div>`;
  document.getElementById('heroTemp').textContent=t0;
  const descMap={clear:'Heiðskírt',partly:'Léttskýjað',cloudy:'Skýjað',
    rain:'Rigning',sleet:'Slydda',snow:'Snjókoma'};
  document.getElementById('heroDesc').textContent=
    `${descMap[kind0]||'Skýjað'}${c0!=null?' · '+Math.round(c0)+'% ský':''}`;


  // ── ÁTTAVITI: núna + 6 klst ──
  const d6=D[6]??d0, w6=W[6]??w0;
  // Ein ör: áttin eftir 6 klst. Núna og +12 klst sem texti.
  const d12=D[12]??d6, w12=W[12]??w6;
  document.getElementById('compass').innerHTML=buildCompass(d6,null);
  document.getElementById('cNow').textContent=`${degToDir(d0)} ${fmtHalf(w0)} m/s`;
  document.getElementById('cLater').textContent=`+6 klst · ${degToDir(d6)} ${fmtHalf(w6)} m/s`;
  document.getElementById('cLater12').textContent=`+12 klst · ${degToDir(d12)} ${fmtHalf(w12)} m/s`;
  // Kviður: aðeins sýndar ef hámark næstu 24 klst fer yfir 8 m/s
  const G=H.windgust||[]; let gmx=-1, gi=-1;
  for(let k=0;k<Math.min(24,G.length);k++){ if(G[k]!=null && G[k]>gmx){ gmx=G[k]; gi=k; } }
  document.getElementById('cGust').innerHTML = gmx>8
    ? `Kviður allt að <b>${fmtHalf(gmx)} m/s</b> kl. ${String(new Date(times[gi]).getHours()).padStart(2,'0')}`
    : '';

  // ── ÚRKOMA ──
  // Samtala næstu 6 og 12 klst
  const _sum=(a,b)=>{let x=0; for(let k=a;k<Math.min(b,P.length);k++) x+=P[k]||0; return x;};
  const r6=_sum(1,7), r12=_sum(1,13);
  document.getElementById('precipIcon').innerHTML=
    Math.round(r6*10)/10>0 ? wxIcon(50,wxKind(c0,r6,t0),r6,isNightHour(nowH),c0) : wxIcon(50,'dry',0,isNightHour(nowH),c0);
  document.getElementById('precipVal').innerHTML=`${fmtRain(r6)}<span class="u">mm</span>`;
  const _pn=document.getElementById('precipNext6');
  _pn.innerHTML=`næstu 6 klst<br>næstu 12 klst: <b>${fmtRain(r12)} mm</b>`;
  _pn.className='n6'+(Math.round(r12*10)/10===0?' empty':'');

  // ── KLUKKUSTUNDASPÁ (24 klst) ──
  let hh='';
  for(let i=0;i<Math.min(24,times.length);i++){
    const hr=fmtHour(times[i]);
    const kind=wxKind(C[i],P[i]||0,Math.round(T[i]??0));
    const night=isNightHour(new Date(times[i]).getHours());
    // Skýjahula námunduð að næstu 5%; úrkoma aðeins ef hún námundast í ≥0.1 mm
    const cc=C[i]!=null?Math.round(C[i]/5)*5:null;
    const pm=P[i]||0, pTxt=Math.round(pm*10)>=1?pm.toFixed(1):'';
    const ws=W[i]!=null?Math.round(W[i]):null;
    hh+=`<div class="hcell${i===0?' now':''}">
      <div class="h">${i===0?'núna':hr}</div>
      <div class="cc">${cc!=null?cc+'%':''}</div>
      <div class="ic">${wxIcon(36,kind,P[i]||0,night,C[i])}</div>
      <div class="p">${pTxt}</div>
      <div class="t">${Math.round(T[i]??0)}°</div>
      <div class="wa">${windArrow(D[i]??0,11)}${ws!=null?`<span class="ws">${ws}</span>`:''}</div>
    </div>`;
  }
  document.getElementById('hrow').innerHTML=hh;

  // ── DAGASPÁ ──
  renderDays(FC);

  // ── Heimild ──
  document.getElementById('foot').innerHTML=
    `<span>Jolly ${FC.model_name?FC.model_name.replace('Jolly ',''):''}</span> · `+
    `Veðurstofa Íslands · MET Norway · Open-Meteo`;
}

function renderDays(FC){
  // [Næstu dagar v2] Fjögur föst tímabil + hitakúrfa. Liðin tímabil í dag
  // koma úr FC.hourly_past (eins og þeim var spáð) og birtast dauf.
  const H=FC.hourly||{}, HP=FC.hourly_past||{};
  const byT={};
  const add=(S,past)=>(S.time||[]).forEach((t,i)=>{
    if(byT[t] && !past) {} else if(byT[t]) return;
    byT[t]={t,day:t.slice(0,10),hr:+t.slice(11,13),past,
      T:(S.temperature||[])[i],W:(S.windspeed||[])[i],D:(S.winddirection||[])[i],
      G:(S.windgust||[])[i],P:(S.precipitation||[])[i],C:(S.cloud_cover||[])[i]};
  });
  add(HP,true); add(H,false);
  const byDay={}; Object.values(byT).forEach(r=>(byDay[r.day]=byDay[r.day]||[]).push(r));
  const PER=[[0,6,'Nótt'],[6,12,'Morgun'],[12,18,'Seinni partur'],[18,24,'Kvöld']];
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const today=(H.time||[''])[0].slice(0,10);
  let days=Object.keys(byDay).sort().map(day=>{
    const rs=byDay[day];
    const per=PER.map(([a,b,lbl])=>{
      const r=rs.filter(x=>x.hr>=a&&x.hr<b&&x.T!=null);
      if(!r.length) return null;
      let sx=0,cx=0; r.forEach(x=>{const w=Math.max(.3,x.W||0);
        sx+=w*Math.sin((x.D||0)*Math.PI/180); cx+=w*Math.cos((x.D||0)*Math.PI/180);});
      return {lbl,T:avg(r.map(x=>x.T)),P:r.reduce((s,x)=>s+(x.P||0),0),
        W:avg(r.map(x=>x.W||0)),D:(Math.atan2(sx,cx)*180/Math.PI+360)%360,
        G:Math.max(...r.map(x=>x.G||0)),C:avg(r.map(x=>x.C||0)),
        past:r.every(x=>x.past),mid:(a+b)/2};
    });
    const all=rs.filter(x=>x.T!=null);
    return {day,per,tmin:Math.min(...all.map(x=>x.T)),tmax:Math.max(...all.map(x=>x.T)),
      psum:rs.reduce((s,x)=>s+(x.P||0),0),gmax:Math.max(...rs.map(x=>x.G||0))};
  }).filter(d=>d.day===today || d.per.every(p=>p)).slice(0,6);

  const temps=days.flatMap(d=>d.per.filter(p=>p).map(p=>p.T));
  const gmin=Math.min(...temps), gmax=Math.max(...temps), span=Math.max(4,gmax-gmin);
  const tcol=t=>{ // kalt=blátt, hlýtt=appelsínurautt (fíngert)
    const f=Math.max(0,Math.min(1,(t-gmin)/span));
    const c1=[127,179,255], c2=[255,138,92];
    return `rgb(${c1.map((v,i)=>Math.round(v+(c2[i]-v)*f)).join(',')})`;};
  const VD=['Sun.','Mán.','Þri.','Mið.','Fim.','Fös.','Lau.'];
  const MN=['jan.','feb.','mar.','apr.','maí','jún.','júl.','ág.','sep.','okt.','nóv.','des.'];
  const gustCls=g=>g>=20?'gst red':(g>=12?'gst':'');

  let html='';
  days.forEach((d,di)=>{
    const dt=new Date(d.day+'T12:00');
    const name=d.day===today?'Í dag':VD[dt.getDay()];
    const date=`${dt.getDate()}. ${MN[dt.getMonth()]}`;
    // hitakúrfa: punktar undir hitatölum, mjúk lína, litur eftir hita
    const pts=d.per.map((p,i)=>p?{x:50+i*100,y:30-((p.T-gmin)/span)*22,c:tcol(p.T)}:null);
    const ok=pts.filter(p=>p);
    let path='';
    ok.forEach((p,i)=>{ if(!i){path=`M${p.x},${p.y}`;return;}
      const q=ok[i-1], mx=(q.x+p.x)/2; path+=` C${mx},${q.y} ${mx},${p.y} ${p.x},${p.y}`;});
    const gid='tg'+di;
    const stops=ok.map(p=>`<stop offset="${(p.x/400*100).toFixed(1)}%" stop-color="${p.c}"/>`).join('');
    const curve=`<svg class="tcurve" viewBox="0 0 400 36" preserveAspectRatio="none">
      <defs><linearGradient id="${gid}" x1="0" x2="400" gradientUnits="userSpaceOnUse">${stops}</linearGradient></defs>
      <path d="M0,${ok[0]?ok[0].y:20} L${ok[0]?ok[0].x:0},${ok[0]?ok[0].y:20}" stroke="${ok[0]?ok[0].c:'#7fb3ff'}" stroke-width="1.6" opacity=".35" fill="none"/>
      <path d="${path}" stroke="url(#${gid})" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M${ok.length?ok[ok.length-1].x:400},${ok.length?ok[ok.length-1].y:20} L400,${ok.length?ok[ok.length-1].y:20}" stroke="${ok.length?ok[ok.length-1].c:'#7fb3ff'}" stroke-width="1.6" opacity=".35" fill="none"/>
      ${pts.map((p,i)=>p?`<circle cx="${p.x}" cy="${p.y}" r="4.2" fill="${p.c}" opacity="${d.per[i].past?.45:1}"/>`:'').join('')}
    </svg>`;
    const cols=d.per.map(p=>{
      if(!p) return `<div class="pc empty"><div class="pl">–</div></div>`;
      const kind=wxKind(p.C,p.P,p.T), night=isNightHour(Math.floor(p.mid));
      return `<div class="pc${p.past?' past':''}">
        <div class="pl">${p.lbl}</div>
        <div class="pi">${wxIcon(40,kind,p.P,night,p.C)}</div>
        <div class="pt" style="color:${tcol(p.T)}">${Math.round(p.T)}°</div>
      </div>`;}).join('');
    const ext=d.per.map(p=>{
      if(!p) return `<div class="px"></div>`;
      const wet=p.P>=0.05;
      return `<div class="px${p.past?' past':''}">
        <div class="pp${wet?' wet':''}">${fmtRain(p.P)} mm</div>
        <div class="pw">${windArrow(p.D,12)}<span>${fmtHalf(p.W)} m/s</span></div>
        ${p.G>=12?`<div class="${gustCls(p.G)}">Kviður ${fmtHalf(p.G)} m/s</div>`:''}
      </div>`;}).join('');
    const ws=d.per.filter(p=>p).map(p=>p.W), wlo=fmtHalf(Math.min(...ws)), whi=fmtHalf(Math.max(...ws));
    html+=`<div class="dcard${di===0?' open':''}">
      <div class="dtop" onclick="this.parentElement.classList.toggle('open')">
        <div class="dn"><div class="dname">${name}</div><div class="ddate">${date}</div></div>
        <div class="pcols">${cols}</div>
        <div class="chev"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="dcurve">${curve}</div>
      <div class="dopen">
        <div class="pxrow">${ext}</div>
        <div class="dsum">
          <div class="sr"><span>Lágmark / Hámark</span><b><i style="color:${tcol(d.tmin)}">${Math.round(d.tmin)}°</i> / <i style="color:${tcol(d.tmax)}">${Math.round(d.tmax)}°</i></b></div>
          <div class="sr"><span>Uppsöfnuð úrkoma</span><b class="${d.psum>=0.05?'wet':''}">${fmtRain(d.psum)} mm</b></div>
          <div class="sr"><span>Vindur (meðal)</span><b>${wlo===whi?wlo:wlo+'–'+whi} m/s</b></div>
          ${d.gmax>=12?`<div class="sr"><span>Kviður</span><b class="${d.gmax>=20?'gred':'gor'}">Allt að ${fmtHalf(d.gmax)} m/s</b></div>`:''}
        </div>
      </div>
    </div>`;
  });
  document.getElementById('days').innerHTML=html;
}

load();
</script>
